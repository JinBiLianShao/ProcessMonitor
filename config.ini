# ============================================================================
# ProcessMonitor 配置模板
#
# 规则：
#   - [方括号] 是节名。节名就是这个进程的内部唯一标识，日志里默认也用它
#   - 键 = 值，等号两边的空格会被自动去掉
#   - 整行以 # 或 ; 开头是注释。没有"行尾注释"，别在值后面写 # 注释
#
# 两类节：
#   [Global]  全局设置，只能有一个
#   其他      都当作一个要托管的进程
#
# 所有数值键都可以省略，省略就用这里写的默认值。写错了会打 WARNING，
# 不会静默忽略 —— 拼错一个字母查半天太亏。
# ============================================================================

[Global]
# 日志级别：DEBUG / INFO / WARNING / ERROR
#   DEBUG   排查问题用，日志量很大
#   INFO    默认，日常用这个
#   WARNING 只看异常
#   ERROR   只看"起不来"和"彻底放弃"
log_level = INFO

# 日志文件。会同时输出到控制台和这个文件。
# 留空则只输出到控制台。建议写绝对路径（相对路径是相对于启动时的当前目录）。
log_file = /tmp/processmonitor.log

# 多久检查一次进程状态（秒）。允许 1 ~ 3600，超出会被钳到边界。
# 别填 0 —— 会被钳成 1。填太小的代价是 CPU 空转，填太大则进程挂了要等很久才发现。
check_interval = 2

# pid 文件。程序启动时独占锁住它，防止起两个实例互相抢进程。
# 留空则不启用。用了 flock，所以进程被 kill -9 之后锁也会自动释放。
pid_file = /tmp/processmonitor.pid


# ============================================================================
# 下面是一个可以立刻跑起来的示例：托管 /bin/sleep
# 换成你自己的程序时，至少改 path 和 working_dir
# ============================================================================

[Demo]
# 显示名，只影响日志。留空则用节名（这里是 Demo）
name = demo

# 可执行文件。必须是普通文件且可执行，不能是目录。
# 相对路径会按 working_dir 解析。
path = /bin/sleep

# 工作目录。子进程启动时 chdir 到这里，相对路径都以它为基准。
# 留空则默认用 path 的父目录。
working_dir = /tmp

# 命令行参数。空格分隔，支持单引号和双引号。
# 注意：不经过 shell，所以没有变量展开、管道、通配符。
args = 3600

# 追加或覆盖的环境变量，逗号分隔，支持 ${VAR} 引用当前环境。
# 注意：是"继承父进程环境 + 覆盖这些"，不是"只用这些"。
# 值里不能带逗号（逗号是分隔符）。
env_vars =

# 首次重启前等几秒。之后的延迟按 2^n 翻倍，受 restart_backoff_max 封顶。
# 填 0 就是立刻重启（不推荐，崩溃循环时会疯狂刷日志）。
restart_delay = 3

# 退避延迟上限（秒）。实际延迟序列：3 → 6 → 12 → 24 → 48 → 60 → 60 ...
restart_backoff_max = 60

# 最多重启几次（不含首次启动）。
#    5   首次启动 + 最多重启 5 次，之后放弃
#    0   只启动一次，挂了就不管了
#   -1   无限重启，永不放弃
# 预算耗尽后监控线程退出，但守护进程本身继续跑（其他进程照常被守护）。
max_restarts = 5

# 优雅关闭等待时间（秒）。
# 停止时先给整个进程组发 SIGTERM，等这么久还不退才发 SIGKILL。
#   无状态小工具    2 ~ 5
#   Web 服务       10 ~ 30
#   数据库/有事务   30 ~ 60
# 填 0 = 不等待，直接 SIGKILL。
graceful_timeout = 10

# 进程这次运行如果活过了这么多秒，就把重启计数清零。
# 解决的是"跑三个月才偶发崩 5 次就被永久放弃"这个问题。
# 填 0 表示不重置（回到老行为）。
restart_reset_after = 60
