# 全局配置节，定义所有进程共享的全局参数
[Global]
# 日志记录级别，可选值：DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO
# 日志文件路径，指定日志输出文件
log_file = process.log
# 进程检查间隔时间（秒），守护进程定期检查子进程状态的时间间隔
check_interval = 2

# 第一个进程配置节，定义数据处理进程的相关参数
[Process1]
# 进程名称，用于标识和管理该进程
name = demo
# 可执行文件路径，指定要运行的程序完整路径
path = /work/ftpd/lsx/demo
# 工作目录，进程启动时的工作目录路径
working_dir = /work/ftpd/lsx
# 命令行参数，传递给可执行文件的启动参数
args =
# 环境变量设置，以逗号分隔的键值对列表
env_vars =
# 重启延迟时间（秒），进程异常退出后重新启动前的等待时间
restart_delay = 3
# 最大重启次数，超过此次数后不再自动重启
max_restarts = 5
# 优雅关闭超时时间（秒），发送终止信号后等待进程正常退出的最长时间
graceful_timeout = 10
